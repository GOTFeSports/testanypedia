<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Anypedia — турниры Dota 2 с ограничением по ПТС</title>
  <meta name="description" content="Энциклопедия полупрофессиональных турниров Dota 2: призовые места, составы, результаты.">
  <script>
    // Тема выбирается до отрисовки, чтобы не мигало
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <a class="logo" href="/">Any<span>pedia</span></a>
      <nav><a href="/" class="active">Турниры</a></nav>
    </div>
  </header>

  <main class="wrap" id="app"><p class="muted">Загрузка…</p></main>

  <footer class="wrap foot">
    Anypedia · полупрофессиональные турниры Dota 2 с ограничением по ПТС
  </footer>

  <button id="theme" class="fab fab-left" type="button" aria-label="Переключить тему" title="Светлая / тёмная тема">
    <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <button id="totop" class="fab fab-right" type="button" aria-label="Наверх" title="Наверх">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <script type="module" src="js/app.js"></script>
</body>
</html>
